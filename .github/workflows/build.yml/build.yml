name: Build APK

# ┌──────────────────────────────────────────────────────────────────┐
# │ 在 GitHub 网页上新建 .github/workflows/build.yml 并粘贴本文件内容  │
# │ 保存后会自动：修复源码已知问题 → 编译 APK → 发布到 Releases        │
# └──────────────────────────────────────────────────────────────────┘

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Patch known issues
        run: |
          python3 - <<'PY'
          import pathlib, os

          def fix(path, old, new):
              p = pathlib.Path(path)
              if not p.exists():
                  print('missing:', path); return
              s = p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old, new), encoding='utf-8')
                  print('patched:', path)
              else:
                  print('already ok:', path)

          # 1) 桌面小部件类名路径写错（.ThoughtWidget 在 com.walltext.app.widget 下）
          fix('app/src/main/AndroidManifest.xml',
              'android:name=".ThoughtWidget"',
              'android:name="com.walltext.app.widget.ThoughtWidget"')

          # 2) 悬浮输入框主题继承 AppCompat，托不住 Material 组件 → 运行期崩溃
          fix('app/src/main/res/values/themes.xml',
              '<style name="Theme.WallText.Dialog" parent="Theme.AppCompat.Dialog">',
              '<style name="Theme.WallText.Dialog" parent="Theme.MaterialComponents.Dialog">')

          # 3) appwidget-provider 里空的 android:configure 会让"添加小部件"直接崩
          fix('app/src/main/res/xml/thought_widget_info.xml',
              'android:widgetCategory="home_screen"\n    android:configure="" />',
              'android:widgetCategory="home_screen" />')

          # 4) WallTextApp 里的 lateinit companion 在 K2 编译器下可能报错，换成最简形式
          wa = pathlib.Path('app/src/main/java/com/walltext/app/WallTextApp.kt')
          if wa.exists():
              wa.write_text(
                  'package com.walltext.app\n'
                  '\n'
                  'import android.app.Application\n'
                  'import com.walltext.app.data.AppDatabase\n'
                  '\n'
                  'class WallTextApp : Application() {\n'
                  '    val database: AppDatabase by lazy { AppDatabase.getInstance(this) }\n'
                  '}\n',
                  encoding='utf-8')
              print('rewritten:', wa)

          # 5) 补齐 API 24-25 的 launcher 图标（原仓库只有 anydpi-v26，老系统无图标）
          os.makedirs('app/src/main/res/mipmap', exist_ok=True)
          icon = (
              '<vector xmlns:android="http://schemas.android.com/apk/res/android"\n'
              '    android:width="48dp" android:height="48dp"\n'
              '    android:viewportWidth="48" android:viewportHeight="48">\n'
              '    <path android:fillColor="#FF6200EE" android:pathData="M0,0h48v48H0z"/>\n'
              '    <path android:fillColor="#FFFFFFFF" android:pathData="M10,16h28v3H10z"/>\n'
              '    <path android:fillColor="#FFFFFFFF" android:pathData="M10,23h28v3H10z"/>\n'
              '    <path android:fillColor="#FFFFFFFF" android:pathData="M10,30h18v3H10z"/>\n'
              '</vector>\n')
          for name in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              pathlib.Path('app/src/main/res/mipmap/' + name).write_text(icon, encoding='utf-8')
              print('created: mipmap/' + name)

          # 6) 顺手补上 .gitignore（网页上传传不了点开头的文件）
          gi = pathlib.Path('.gitignore')
          if not gi.exists():
              gi.write_text(
                  '.gradle/\nbuild/\n/app/build/\ndist/\n*.log\n.idea/\n*.iml\n'
                  'local.properties\n.cxx/\n*.jks\n*.keystore\n.DS_Store\n',
                  encoding='utf-8')
              print('created: .gitignore')

          print('patch done')
          PY

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/WallText-1.0.0-debug.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallText-debug
          path: dist/WallText-1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 壁语 WallText v1.0.0 (debug)
          body: |
            「壁语」Android 文字壁纸应用 — debug 签名 APK，可直接安装。

            - 6 种预设文字样式
            - 桌面小部件，点击即可记录
            - 本地 Room 存储，仅需 SET_WALLPAPER 权限
          files: dist/WallText-1.0.0-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit fixes back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 自动修复源码已知问题 [skip ci]"
          git push || true

      - name: Report build failure as issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '(no build.log captured)';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) {}
            const tail = log.length > 40000 ? log.slice(-40000) : log;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Build failed @ ' + context.sha.slice(0, 7),
              body: '```\n' + tail.split('```').join('``\u200b`') + '\n```'
            });
